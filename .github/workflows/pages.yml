name: Deploy PinHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Build the PinHub frontend
        run: node build-pages.mjs
        env:
          PINHUB_API_ORIGIN: https://pinhub.y27866652.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
